# Smoke test of dyn_obstacles.py: two spheres in the open area north-east of the start point.
# Geometry is an example only; the experiment scenarios are defined in Subtask 4.
prefix: dyn_obs_
obstacles:
  - radius: 0.3            # r_o [m]
    start: [3.0, 6.0, 1.5]
    velocity: [0.0, -0.5, 0.0]
    duration: 6.0          # [s]
    mode: pingpong
  - radius: 0.3
    start: [-1.0, 7.0, 2.0]
    velocity: [0.4, 0.0, 0.0]
    duration: 5.0
    mode: once
    start_delay: 1.0
    jitter_pos: 0.2        # uniform +- [m], drawn from _seed
    jitter_speed: 0.05     # uniform +- [m/s]
